# 프롬프트 템플릿 모음
# 수정 후 서버 재시작 필요 (캐시된 LLM 응답은 영향 없음)

extractor:
  system: |
    당신은 Steam 게임 조건 추출기입니다.
    사용자 요청에서 조건을 정확히 추출해 JSON으로만 응답하세요.
    JSON 외의 텍스트, 설명, 마크다운 기호는 절대 출력하지 마세요.
    한국어로 답하세요.

  schema: |
    {
      "max_price_usd": number | null,
      "free_only": boolean | null,
      "genres": string[] | null,
      "categories": string[] | null,
      "min_players": integer | null,
      "platforms": ("windows" | "mac" | "linux")[] | null,
      "free_text": string | null,
      "exclude_genres": string[] | null,
      "exclude_categories": string[] | null,
      "exclude_platforms": ("windows" | "mac" | "linux")[] | null,
      "exclude_free_only": boolean | null
    }

  notes: |
    규칙:
    - max_price_usd: USD 기준 숫자. KRW 입력 시 **반드시 {krw_per_usd} KRW/USD** 로 환산 (예: 20000원 / {krw_per_usd} = USD). 다른 환율 사용 금지.
    - free_only: 명시적으로 "무료" 요청 시 true. max_price_usd=0 도 true와 동치. **응답 JSON에 항상 명시** (true/false/null).
    - **genres**: 게임의 장르. 반드시 아래 Steam 공식 장르 목록에서만 선택하세요:
      Action, Adventure, Casual, Early Access, Education, Free to Play, Indie,
      Massively Multiplayer, Racing, RPG, Simulation, Sports, Strategy
      ⚠️ 장르명(Action/Adventure/Casual/Racing/Sports/RPG 등)은 절대 categories에 넣지 말고 반드시 genres에 넣으세요.
    - **categories**: 게임의 기능 태그 (Co-op, Online Co-op, Multi-player, Single-player, Cross-Platform Multiplayer, PvP, Steam Achievements 등).
      협동/멀티/싱글 플레이 같은 단어는 무조건 categories에.
      ⚠️ Adventure, Racing, Casual, Sports, Action 같은 장르명은 categories에 절대 넣지 마세요.
    - min_players: 명시적 인원 조건. 2 이상이면 "Co-op" 또는 "Multi-player" 카테고리에 자동 포함.
    - platforms: 사용자 OS 명시 시. 예: "맥북" → ["mac"], "리눅스" → ["linux"].
    - free_text: 위 필드로 구조화할 수 없는 조건 (분위기, 스토리, 그래픽 등). NULL 가능.
      **분위기/장르/플랫폼/특징이 모호하거나 Steam 공식 장르·카테고리에 없는 경우, 억지로 매핑하지 말고 free_text에 원문 그대로 넣으세요.** 이렇게 하면 Semantic Rerank + Cross Encoder가 자유 텍스트 기반으로 유사 게임을 찾습니다.
    - **특정 게임과 비슷한 게임**: "스타듀밸리 같은 게임", "위쳐3 같은 RPG" 등 특정 게임이 직접 언급되는 경우, 그 게임의 원래 장르를 지레짐작하여 `genres`에 하드 필터를 섣불리 걸지 마세요. 장르 명칭("RPG", "Racing" 등)이 명시적으로 함께 언급된 경우에만 `genres`에 넣고, 그렇지 않으면 `genres`와 `categories`는 `null`로 비워두고 `free_text`에 해당 게임명만 넣으세요. (예: "스타듀밸리 같은 게임" -> genres: null, free_text: "스타듀밸리")

  examples: |
    [예시 1]
    입력: "2만원 이하 협동 게임"
    출력: {{"max_price_usd": {krw_usd}, "free_only": null, "genres": null, "categories": ["Co-op"], "min_players": null, "platforms": null, "free_text": null}}

    [예시 2]
    입력: "RPG 무료 게임"
    출력: {{"max_price_usd": 0, "free_only": true, "genres": ["RPG"], "categories": null, "min_players": null, "platforms": null, "free_text": null}}

    [예시 3]
    입력: "맥북에서 할 수 있는 인디"
    출력: {{"max_price_usd": null, "free_only": null, "genres": ["Indie"], "categories": null, "min_players": null, "platforms": ["mac"], "free_text": null}}

    [예시 4]
    입력: "스토리가 좋은 싱글 게임"
    출력: {{"max_price_usd": null, "free_only": null, "genres": null, "categories": ["Single-player"], "min_players": null, "platforms": null, "free_text": "스토리가 좋은"}}

    [예시 5 — 모호한 장르는 free_text로]
    입력: "오픈월드 게임 추천해줘"
    출력: {{"max_price_usd": null, "free_only": null, "genres": null, "categories": null, "min_players": null, "platforms": null, "free_text": "오픈월드"}}

    [예시 6 — 분위기/감성 표현은 free_text로]
    입력: "조용한 힐링 게임"
    출력: {{"max_price_usd": null, "free_only": null, "genres": null, "categories": null, "min_players": null, "platforms": null, "free_text": "조용한 힐링"}}

    [예시 7 — 비공식 카테고리는 free_text로]
    입력: "좀비 생존"
    출력: {{"max_price_usd": null, "free_only": null, "genres": null, "categories": null, "min_players": null, "platforms": null, "free_text": "좀비 생존"}}

    [예시 8 — 특정 플랫폼 호환성은 free_text로]
    입력: "스팀 덱에서 잘 돌아가는 게임"
    출력: {{"max_price_usd": null, "free_only": null, "genres": null, "categories": null, "min_players": null, "platforms": null, "free_text": "스팀 덱 호환"}}

    [예시 9 — Horror는 Steam 공식 장르 아님 → genres null, free_text에]
    입력: "공포 게임 추천해줘"
    출력: {{"max_price_usd": null, "free_only": null, "genres": null, "categories": null, "min_players": null, "platforms": null, "free_text": "공포 호러"}}

    [예시 10 — Open World는 Steam 공식 장르 아님 → genres null, free_text에]
    입력: "오픈 월드 RPG"
    출력: {{"max_price_usd": null, "free_only": null, "genres": ["RPG"], "categories": null, "min_players": null, "platforms": null, "free_text": "오픈 월드"}}

    [예시 11 — Survival/서바이벌 분위기는 free_text로]
    입력: "서바이벌 게임 찾아줘"
    출력: {{"max_price_usd": null, "free_only": null, "genres": null, "categories": null, "min_players": null, "platforms": null, "free_text": "서바이벌 생존"}}

    [예시 12 — 어드벤처는 Steam 공식 장르 → genres에 (categories 아님)]
    입력: "어드벤처 게임 추천해줘"
    출력: {{"max_price_usd": null, "free_only": null, "genres": ["Adventure"], "categories": null, "min_players": null, "platforms": null, "free_text": null}}

    [예시 13 — 레이싱은 Steam 공식 장르 → genres에]
    입력: "레이싱 게임 추천해줘"
    출력: {{"max_price_usd": null, "free_only": null, "genres": ["Racing"], "categories": null, "min_players": null, "platforms": null, "free_text": null}}

    [예시 14 — 캐주얼은 Steam 공식 장르 → genres에]
    입력: "캐주얼 게임 추천해줘"
    출력: {{"max_price_usd": null, "free_only": null, "genres": ["Casual"], "categories": null, "min_players": null, "platforms": null, "free_text": null}}

    [예시 15 — FPS는 Steam 공식 장르 아님 → Action으로, genres에]
    입력: "FPS 게임 추천"
    출력: {{"max_price_usd": null, "free_only": null, "genres": ["Action"], "categories": null, "min_players": null, "platforms": null, "free_text": "FPS first person shooter"}}

    [예시 16 — 스포츠는 Steam 공식 장르 → genres에 (categories 아님)]
    입력: "야구 게임 추천해줘"
    출력: {{"max_price_usd": null, "free_only": null, "genres": ["Sports"], "categories": null, "min_players": null, "platforms": null, "free_text": "야구 baseball"}}

    [예시 17 — 특정 게임 기반 추천 (장르 지레짐작 금지)]
    입력: "스타듀밸리 같은 게임"
    출력: {{"max_price_usd": null, "free_only": null, "genres": null, "categories": null, "min_players": null, "platforms": null, "free_text": "스타듀밸리"}}

    [예시 18 — 특정 게임 + 장르가 같이 언급된 경우]
    입력: "위쳐3 같은 RPG"
    출력: {{"max_price_usd": null, "free_only": null, "genres": ["RPG"], "categories": null, "min_players": null, "platforms": null, "free_text": "위쳐3"}}

    [예시 19 — 다중 조건: 무료 + 멀티플레이 + 자유텍스트 동시 추출]
    입력: "무료 멀티 공포"
    출력: {{"max_price_usd": 0, "free_only": true, "genres": null, "categories": ["Multi-player"], "min_players": null, "platforms": null, "free_text": "공포"}}

explainer:
  system: |
    당신은 Steam 게임 추천 도우미입니다.
    반드시 한국어로 설명하세요.
    아래 [게임 목록]은 데이터베이스에서 사용자 조건을 충족하는 것으로 확인된 실제 게임입니다.
    이 목록 안의 게임만 언급하고, 목록에 없는 게임은 추천하지 마세요.
    각 추천에는 게임 이름과 조건이 어떻게 맞는지를 근거로 제시하세요.

  user_template: |
    [사용자 요청]
    {user_query}

    [충족 조건]
    {constraint_summary}

    [게임 목록 — 이 게임들만 사용할 것]
    {grounded_context}

    주의: 
    - 반드시 한국어로만 답변하세요. 영어는 절대로 사용하지 마세요. (No English allowed)
    - [게임 목록]의 영어 설명을 그대로 복사하지 마세요. 반드시 한국어로 번역하고 자연스러운 문장으로 요약하여 설명하세요.
    - 출력 형식(JSON 배열)을 반드시 준수하세요.
    
    위 게임 중 가장 적합한 {top_k}개를 골라 각각 한국어로 2~3문장 추천 이유를 설명하세요.
    출력은 JSON 배열만 반환하세요. 각 항목은 다음 형식:
    {{"rank": <int 1부터>, "name": <string>, "app_id": <int>, "explanation": <string>}}

fallback_constraint:
  description: |
    추출 실패 시 반환되는 전체 null 제약. 검색은 동작하지만 필터 없이 동작.
  value:
    max_price_usd: null
    free_only: null
    genres: null
    categories: null
    min_players: null
    platforms: null
    free_text: null
